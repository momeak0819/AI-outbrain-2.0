[asr]
# Default local ASR engine.
engine = faster-whisper

[faster_whisper]
model_size = base
device = cpu
compute_type = int8
language = zh

[mimo]
api_key =
api_url = https://api.xiaomimimo.com/v1/chat/completions

[custom_api]
api_url =
api_key =

[aliyun_qwen_asr]
api_key =
base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
model = qwen-audio-asr
timeout = 120

[tencent_asr]
secret_id =
secret_key =
region = ap-guangzhou
engine_model_type = 16k_zh
poll_interval = 2
poll_attempts = 20
timeout = 120

[volcengine_asr]
app_id =
access_token =
cluster = volcengine_streaming_common
audio_url =
submit_url = https://openspeech.bytedance.com/api/v1/auc/submit
query_url = https://openspeech.bytedance.com/api/v1/auc/query
poll_interval = 2
poll_attempts = 20
timeout = 120

[output]
# Default transcript output directory.
folder = Obsidian\AI外脑知识库\00_Inbox\抖音链接
# Default extracted audio directory.
audio_folder = Obsidian\AI外脑知识库\00_Inbox\抖音链接\audio

[preferences]
# 导出格式: md / txt / both
export_format = md
# Agent reply mode: desktop / im. IM mode includes transcript text in JSON replies.
agent_reply_mode = im
# Interactive content: original / card / both
im_content_mode = both
# Review channel: auto / im / terminal
interaction_channel = auto
# 是否保留提取的音频文件: true / false
keep_audio = false

[mcp]
# configured / skipped / failed / pending
setup_status = pending
# Non-secret metadata only. Keep endpoints and credentials in the agent's secure MCP settings.
client =
transport =
verified_at =
